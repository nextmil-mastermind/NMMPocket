<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link rel="stylesheet" href="/rsvp/theme.css">
</head>
<body>
    <div class="card center">
        <div class="brand">
            <img class="brand-mark" src="https://nextmilmastermind.com/logos/LOGO-NEXT-MILLION-MASTERMIND-3.png" alt="Next Million Mastermind">
            <span class="brand-wordmark">Next Million Mastermind</span>
        </div>
        <p class="eyebrow">RSVP</p>
        <h1>{{.title}}</h1>
        <p>{{.message}}</p>
        {{if .slug}}<a class="button link-cta" href="/rsvp/{{.slug}}">Continue to login</a>{{end}}
    </div>
</body>
</html>
