<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f5f5f5; }
        .card { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 480px; margin: 1rem; text-align: center; }
        h1 { color: #333; font-size: 1.6rem; margin-bottom: 1rem; }
        .message { color: #555; line-height: 1.5; }
        .message p { margin-bottom: 0.75rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{.title}}</h1>
        <div class="message">{{.message}}</div>
    </div>
</body>
</html>
