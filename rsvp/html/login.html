<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - {{.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f5f5f5; }
        .card { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; margin: 1rem; }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { color: #333; font-size: 1.6rem; margin-bottom: 0.5rem; }
        .header p { color: #666; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #007bff; }
        .button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        .button:hover { background-color: #0056b3; }
        .error { color: #dc3545; font-size: 0.9rem; margin-bottom: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Next Million Mastermind</h1>
            <p>Log in to RSVP for {{.title}}</p>
        </div>
        {{if .error}}<div class="error">{{.error}}</div>{{end}}
        <form method="POST" action="/rsvp/{{.slug}}/login">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="button">Log In</button>
        </form>
    </div>
</body>
</html>
