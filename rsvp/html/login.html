<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - {{.title}}</title>
    <link rel="stylesheet" href="/rsvp/theme.css">
</head>
<body>
    <div class="card">
        <div class="brand">
            <img class="brand-mark" src="https://nextmilmastermind.com/logos/LOGO-NEXT-MILLION-MASTERMIND-3.png" alt="Next Million Mastermind">
            <span class="brand-wordmark">Next Million Mastermind</span>
        </div>
        <div class="header">
            <p class="eyebrow">Member RSVP</p>
            <h1>{{.title}}</h1>
            <p>Log in to confirm your attendance.</p>
        </div>
        {{if .error}}<div class="error">{{.error}}</div>{{end}}
        <form method="POST" action="/rsvp/{{.slug}}/login">
            <div class="form-group">
                <label for="username">Email</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="button">Log In</button>
        </form>
    </div>
</body>
</html>
