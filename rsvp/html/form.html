<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP - {{.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f5f5f5; }
        .card { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 480px; margin: 1rem; }
        .header { text-align: center; margin-bottom: 1.5rem; }
        .header h1 { color: #333; font-size: 1.6rem; margin-bottom: 0.4rem; }
        .header p { color: #666; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #555; font-size: 0.9rem; }
        .choices { display: flex; gap: 0.75rem; }
        .choices label { display: flex; align-items: center; gap: 0.4rem; padding: 0.6rem 0.8rem; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; flex: 1; justify-content: center; }
        input[type="number"], textarea { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
        textarea { min-height: 90px; resize: vertical; }
        .button { width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; }
        .button:hover { background-color: #0056b3; }
        .button:disabled { background-color: #ccc; cursor: not-allowed; }
        .error { color: #dc3545; font-size: 0.9rem; margin-bottom: 1rem; text-align: center; }
        .notice { background: #fff3cd; color: #856404; padding: 0.75rem; border-radius: 5px; margin-bottom: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>{{.title}}</h1>
            <p>Hi {{.firstName}}, please let us know if you can attend.</p>
        </div>
        {{if not .open}}<div class="notice">This RSVP is closed. You can view your response but cannot change it.</div>{{end}}
        {{if .error}}<div class="error">{{.error}}</div>{{end}}
        <form method="POST" action="/rsvp/{{.slug}}">
            <div class="form-group">
                <label>Will you attend?</label>
                <div class="choices">
                    <label><input type="radio" name="status" value="yes" {{if eq .status "yes"}}checked{{end}} {{if not .open}}disabled{{end}} required> Yes</label>
                    <label><input type="radio" name="status" value="no" {{if eq .status "no"}}checked{{end}} {{if not .open}}disabled{{end}}> No</label>
                    <label><input type="radio" name="status" value="maybe" {{if eq .status "maybe"}}checked{{end}} {{if not .open}}disabled{{end}}> Maybe</label>
                </div>
            </div>
            <div class="form-group">
                <label for="guests">Additional guests</label>
                <input type="number" id="guests" name="guests" min="0" value="{{.guests}}" {{if not .open}}disabled{{end}}>
            </div>
            <div class="form-group">
                <label for="note">Note (optional)</label>
                <textarea id="note" name="note" {{if not .open}}disabled{{end}}>{{.note}}</textarea>
            </div>
            <button type="submit" class="button" {{if not .open}}disabled{{end}}>Submit RSVP</button>
        </form>
    </div>
</body>
</html>
