<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP received - {{.title}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background-color: #f5f5f5; }
        .card { background-color: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); width: 100%; max-width: 440px; margin: 1rem; text-align: center; }
        h1 { color: #333; font-size: 1.6rem; margin-bottom: 0.75rem; }
        p { color: #555; margin-bottom: 0.5rem; }
        .status { font-size: 1.2rem; font-weight: 600; color: #198754; margin: 1rem 0; }
        a { color: #007bff; text-decoration: none; display: inline-block; margin-top: 1rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>{{.title}}</h1>
        <p>Thank you. Your RSVP has been saved.</p>
        <div class="status">{{.statusLabel}}</div>
        {{if .hasGuests}}<p>Additional guests: {{.guests}}</p>{{end}}
        {{if .note}}<p>{{.note}}</p>{{end}}
        <a href="/rsvp/{{.slug}}">Update your response</a>
    </div>
</body>
</html>
