<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP received - {{.title}}</title>
    <link rel="stylesheet" href="/rsvp/theme.css">
</head>
<body>
    <div class="card center">
        <div class="brand">
            <img class="brand-mark" src="https://nextmilmastermind.com/logos/LOGO-NEXT-MILLION-MASTERMIND-3.png" alt="Next Million Mastermind">
            <span class="brand-wordmark">Next Million Mastermind</span>
        </div>
        <p class="eyebrow">RSVP received</p>
        <h1>{{.title}}</h1>
        <p>Thank you. Your RSVP has been saved.</p>
        <div class="status{{if eq .status "decline"}} declined{{end}}">{{.statusLabel}}</div>
        {{if .hasGuests}}<p>Additional guests: {{.guests}}</p>{{end}}
        {{if .note}}<p>{{.note}}</p>{{end}}
        <a class="button link-cta" href="/rsvp/{{.slug}}">Update your response</a>
    </div>
</body>
</html>
